[project]
name = "{{PACKAGE_NAME}}"
dynamic = ["version"]
description = "{{PROJECT_DESCRIPTION_TOML}}"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
    {{AUTHOR_ENTRY}},
]
keywords = ["python", "template", "uv", "ruff", "pytest", "mypy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "{{GITEA_HOST}}/{{GITEA_USER}}/{{PACKAGE_NAME}}"
Repository = "{{GITEA_HOST}}/{{GITEA_USER}}/{{PACKAGE_NAME}}"
Issues = "{{GITEA_HOST}}/{{GITEA_USER}}/{{PACKAGE_NAME}}/issues"

[project.scripts]
{{PACKAGE_NAME}} = "{{PACKAGE_NAME}}.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.50",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "rich>=14.2.0",
    "ruff>=0.14.9",
]

[tool.ruff]
exclude = [".git", ".venv", "__pycache__", "build", "dist"]
line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
warn_return_any = false
warn_unused_configs = true
explicit_package_bases = true
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["tests", "scripts", "build", "dist"]

[[tool.uv.index]]
name = "pypi"
url = "{{INTERNAL_PYPI_INDEX}}"

[[tool.uv.index]]
name = "hong"
url = "{{GITEA_HOST}}/api/packages/{{GITEA_USER}}/pypi/simple/"
publish-url = "{{GITEA_HOST}}/api/packages/{{GITEA_USER}}/pypi/"
explicit = true
