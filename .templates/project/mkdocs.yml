site_name: "{{PROJECT_TITLE_YAML}}"
site_description: "{{PROJECT_DESCRIPTION_YAML}}"
site_url: "{{GITEA_HOST}}/{{GITEA_USER}}/{{PACKAGE_NAME}}"
repo_url: "{{GITEA_HOST}}/{{GITEA_USER}}/{{PACKAGE_NAME}}"
repo_name: "{{GITEA_USER}}/{{PACKAGE_NAME}}"
edit_uri: src/branch/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 开发:
      - 开发总览: development/index.md
      - 本地环境: development/environment.md
      - 工作流: development/workflow.md
      - 平台与架构: development/platforms.md
      - 发布与凭据: development/release.md
      - 发布排错: development/release-troubleshooting.md
      - 安全与审计: development/security.md
      - 贡献约定: development/contributing.md
      - 模板维护: development/template-maintenance.md
  - 用户指南:
      - 使用总览: user-guide/index.md
  - 接口参考:
      - 参考总览: reference/index.md
  - 运维:
      - 部署与运行: operations/deployment.md
  - 决策记录:
      - ADR 总览: adr/index.md
